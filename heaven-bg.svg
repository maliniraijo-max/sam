<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset=".5" stop-color="#fff8e9"/><stop offset="1" stop-color="#f1eadb"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff3bd" stop-opacity=".95"/><stop offset="1" stop-color="#fff3bd" stop-opacity="0"/></radialGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9eeee"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".7" stop-color="#d7ece8"/><stop offset="1" stop-color="#fffdf5"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="820" cy="155" rx="360" ry="250" fill="url(#glow)"/>
<!-- soft heavenly clouds -->
<g fill="#ffffff" opacity=".82" filter="url(#blur)">
 <ellipse cx="170" cy="170" rx="260" ry="72"/><ellipse cx="430" cy="120" rx="300" ry="82"/>
 <ellipse cx="1120" cy="125" rx="330" ry="78"/><ellipse cx="1450" cy="190" rx="250" ry="70"/>
 <ellipse cx="280" cy="330" rx="250" ry="55"/><ellipse cx="1320" cy="330" rx="280" ry="60"/>
</g>
<!-- distant soft hills -->
<path d="M0 470 C180 400 310 410 470 475 C620 535 760 475 900 455 C1080 430 1210 470 1370 435 C1480 410 1550 430 1600 450 L1600 900 L0 900Z" fill="#e8dfce" opacity=".68"/>
<path d="M0 535 C190 475 350 485 500 540 C660 600 820 520 970 510 C1140 500 1300 535 1600 500 L1600 900 L0 900Z" fill="#dceae2" opacity=".78"/>
<!-- main waterfall, smooth and vertical -->
<path d="M735 390 C760 480 752 585 725 690 C700 785 695 845 690 900 L910 900 C900 835 895 770 870 690 C842 585 840 480 865 390 Z" fill="url(#water)" opacity=".96"/>
<path d="M785 410 C800 520 790 650 775 760 C764 820 760 865 760 900 L825 900 C824 845 818 800 808 750 C790 645 790 520 805 410Z" fill="#ffffff" opacity=".8"/>
<!-- mist -->
<g fill="#fff" opacity=".72" filter="url(#soft)">
 <ellipse cx="800" cy="875" rx="330" ry="62"/>
 <ellipse cx="260" cy="700" rx="250" ry="55"/>
 <ellipse cx="1330" cy="690" rx="270" ry="55"/>
</g>
<!-- gentle golden light particles -->
<g fill="#d5b66a" opacity=".42">
 <circle cx="190" cy="690" r="4"/><circle cx="320" cy="750" r="3"/><circle cx="1360" cy="720" r="4"/>
 <circle cx="1460" cy="640" r="3"/><circle cx="540" cy="240" r="3"/><circle cx="1080" cy="270" r="3"/>
</g>
</svg>