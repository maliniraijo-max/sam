<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef9fb">
<title>Explore • Sam's Learning</title>
<link rel="stylesheet" href="style.css?v=20260925-010">
<script>
  const exploreMode = new URLSearchParams(location.search).get("mode") || "web";
  if (exploreMode === "web" || exploreMode === "ai" || exploreMode === "break") {
    if (exploreMode === "web") document.documentElement.classList.add("web-search-mode");
    if (exploreMode === "ai") document.documentElement.classList.add("ai-search-mode");
    if (exploreMode === "break") document.documentElement.classList.add("break-search-mode");
    // Google provides the working search box below; hide Sam's fallback bar before first paint.
    const hideFallback = document.createElement("style");
    hideFallback.textContent = "#exploreForm,#suggestions{display:none!important}";
    document.head.appendChild(hideFallback);
  }
</script>
</head>
<body class="explore-page">
<header class="explore-hero">
  <a class="back-home" href="./">← Sam's Learning</a>
  <div id="exploreIcon" class="explore-icon">🔎</div>
  <p class="eyebrow" id="exploreEyebrow">WEB SEARCH</p>
  <h1 id="exploreTitle">Search the web</h1>
  <p id="exploreSubtitle">Fresh Google-powered results, shown simply for Sam.</p>
</header>

<main class="explore-shell">
  <form id="exploreForm" class="explore-searchbar">
    <span id="searchGlyph">⌕</span>
    <input id="exploreInput" autocomplete="off" autofocus maxlength="300" placeholder="What do you want to explore?">
    <button type="submit" aria-label="Search">Search</button>
  </form>

  <div id="suggestions" class="explore-suggestions"></div>

  <section id="googleWebSearch" class="google-web-search" aria-label="Web search">
    <div class="google-searchbox-card">
      <div class="gcse-searchbox"
           data-gname="samWebSearch"
           data-enableAutoComplete="true"
           data-autoCompleteMaxCompletions="6"></div>
    </div>
    <div class="google-results-panel">
      <div class="google-results-title">🔎 Search results</div>
      <div class="gcse-searchresults"
           data-gname="samWebSearch"
           data-webSearchResultSetSize="10"
           data-linkTarget="_self"></div>
    </div>
  </section>

  <section id="googleImageSearch" class="google-image-search" aria-label="Image search">
    <div class="google-searchbox-card">
      <div class="gcse-searchbox"
           data-gname="samImageSearch"
           data-enableAutoComplete="true"
           data-autoCompleteMaxCompletions="8"></div>
    </div>
    <div class="google-image-results-panel">
      <div class="google-results-title">🌿 Pictures for Sam</div>
      <div class="gcse-searchresults"
           data-gname="samImageSearch"
           data-enableImageSearch="true"
           data-defaultToImageSearch="true"
           data-disableWebSearch="true"
           data-imageSearchLayout="classic"
           data-imageSearchResultSetSize="large"
           data-image_filter="1"></div>
    </div>
  </section>

  <section id="loading" class="explore-loading hidden">
    <div class="spinner"></div>
    <strong id="loadingText">Searching…</strong>
  </section>
  <section id="results" class="explore-results"></section>
</main>

<div id="imageLightbox" class="image-lightbox hidden" role="dialog" aria-modal="true" aria-label="Larger picture">
  <button id="closeImageLightbox" class="image-lightbox-close" type="button" aria-label="Close">×</button>
  <div class="image-lightbox-inner">
    <img id="lightboxImage" src="" alt="">
  </div>
</div>

<script>
window.__gcse = {
  parsetags: "onload",
  searchCallbacks: {
    web: {
      rendered: function(gname, query, promos, resultEls) {
        resultEls.forEach(function(el) {
          el.querySelectorAll("a.gs-title, a.gs-visibleUrl").forEach(function(link) {
            var href = link.href;
            if (!/^https?:\/\//i.test(href)) return;
            link.addEventListener("click", function(ev) {
              ev.preventDefault();
              ev.stopPropagation();
              var back = location.href.split("#")[0];
              location.href =
                "site-viewer.html?url=" + encodeURIComponent(href) +
                "&return=" + encodeURIComponent(back);
            }, true);
          });
        });
      }
    }
  }
};
</script>
<script async src="https://cse.google.com/cse.js?cx=518c9e656d6e04393"></script>
<script src="explore.js?v=20260925-013"></script>
</body>
</html>
