<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Verses • Catechism 2026–27</title><link rel="stylesheet" href="style.css"><style>body{background:#f7f8f4;color:#23384a;font-family:system-ui,sans-serif;line-height:1.6}.shell{max-width:900px;margin:auto;padding:16px}.back{font-weight:800;color:#22577b;text-decoration:none}.hero{margin:15px 0;padding:24px;border-radius:20px;background:#fff4d6;border:1px solid #e8d9b2}.verse{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;background:white;border:1px solid #e5e8e6;border-radius:14px;padding:14px;margin:10px 0}.num{background:#eaf3eb;color:#2b6b45;border-radius:10px;text-align:center;font-weight:900;padding:5px}.verse p{margin:0 0 5px}.verse strong{color:#315d7b;font-size:.9rem}.speak{border:0;background:#eaf3ff;color:#1b5784;border-radius:9px;padding:8px;font-weight:800}@media(max-width:520px){.verse{grid-template-columns:30px 1fr}.speak{grid-column:2;justify-self:start}}</style></head><body><main class="shell"><a class="back" href="catechism.html">← Back to Catechism</a><header class="hero"><h1>📖 Bible Verses · 2026–27</h1><p>All 21 verses from the supplied poster. Read and memorise the verse and its Bible reference.</p></header><p>Tap Read to hear a verse. Pronunciation depends on voices available on your device.</p><div id="verses"></div></main><script>const verses=[
['The LORD looks down from heaven; He sees all humankind.','Psalms 33:13'],['The LORD bless you and keep you.','Numbers 6:24'],['Know that I am with you and will keep you wherever you go.','Genesis 28:15'],['Do not fear, for I am with you.','Isaiah 41:10'],['For this is the will of God, your sanctification.','1 Thessalonians 4:3'],['My help comes from the LORD, who made heaven and earth.','Psalms 121:2'],['But those who drink of the water that I will give them will never be thirsty.','John 4:14'],['I can do all things through him who strengthens me.','Philippians 4:13'],['Now you are the body of Christ and individually members of it.','1 Corinthians 12:27'],['The eyes of the LORD are in every place, keeping watch on the evil and the good.','Proverbs 15:3'],['I cling to your decrees, O LORD.','Psalms 119:31'],['Blessed are the pure in heart, for they will see God.','Matthew 5:8'],['Do you not know that you are God’s temple and that God’s spirit dwells in you?','1 Corinthians 3:16'],['Everyone therefore who acknowledges me before others, I also will acknowledge before my Father in heaven.','Matthew 10:32'],['Your word is a lamp to my feet and a light to my path.','Psalms 119:105'],['When I am afraid, I put my trust in You.','Psalms 56:3'],['Whoever, therefore, eats the bread or drinks the cup of the LORD in an unworthy manner will be answerable for the body and blood of the LORD.','1 Corinthians 11:27'],['Little children, let us love, not in word or speech, but in truth and action.','1 John 3:18'],['Let all that you do be done in love.','1 Corinthians 16:14'],['And blessed is she who believed that there would be a fulfilment of what was spoken to her by the LORD.','Luke 1:45'],['Rejoice always.','1 Thessalonians 5:16']];document.getElementById('verses').innerHTML=verses.map((v,i)=>'<article class="verse"><div class="num">'+(i+1)+'</div><div><p>'+v[0]+'</p><strong>'+v[1]+'</strong></div><button class="speak" onclick="say('+i+')">🔊 Read</button></article>').join('');function say(i){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(verses[i].join('. '));u.rate=.78;u.lang='en-US';speechSynthesis.speak(u)}</script></body></html>
